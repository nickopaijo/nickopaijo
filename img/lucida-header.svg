<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="285" viewBox="0 0 1100 285" role="img" aria-label="NICKOPAIJO Cyber Terminal header in Lucida Console styling">
<defs>
 <linearGradient id="base" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#05070D"/><stop offset=".5" stop-color="#0B1720"/><stop offset="1" stop-color="#1D0C31"/></linearGradient>
 <linearGradient id="beam" x1="0" x2="1"><stop stop-color="#4DFFAA"/><stop offset="1" stop-color="#A855F7"/></linearGradient>
 <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse"><path d="M34 0H0V34" fill="none" stroke="#8B5CF6" stroke-width=".5" opacity=".16"/></pattern>
 <filter id="glow"><feGaussianBlur stdDeviation="7" result="g"/><feMerge><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <style>
 text {font-family:'Lucida Console', 'Consolas', 'DejaVu Sans Mono', monospace;}
 .scan {animation:scan 5s linear infinite;}
 .blink {animation:blink 1.15s steps(2,end) infinite;}
 @keyframes scan {0%{transform:translateY(-320px);opacity:0}20%{opacity:.38}80%{opacity:.22}100%{transform:translateY(320px);opacity:0}}
 @keyframes blink {50%{opacity:0;}}
 @media (prefers-reduced-motion:reduce) {.scan,.blink{animation:none;}}
 </style>
</defs>
<rect width="1100" height="285" rx="17" fill="url(#base)"/>
<rect width="1100" height="285" rx="17" fill="url(#grid)"/>
